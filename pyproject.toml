[project]
name = "argus"
version = "0.1.0"
description = "Argus — Enterprise Research Operating System for evidence-based financial research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Design Bible §9: higher layers never bypass lower layers.
[tool.importlinter]
root_package = "argus"

[[tool.importlinter.contracts]]
name = "Layered architecture (ARCHITECTURE.md §2)"
type = "layers"
layers = [
    "argus.ui | argus.api",
    "argus.investigations",
    "argus.agentruntime",
    "argus.research",
    "argus.knowledge",
    "argus.dataplatform",
    "argus.observability",
    "argus.core",
]
