services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${ARGUS_POSTGRES_PASSWORD:-argus}
      POSTGRES_DB: argus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    environment:
      ARGUS_DATABASE_URL: postgresql+psycopg://argus:${ARGUS_POSTGRES_PASSWORD:-argus}@postgres:5432/argus
    env_file:
      - path: .env
        required: false
    volumes: ["rawstore:/app/data", "hf_cache:/home/app/.cache"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    command: ["argus", "worker"]
    environment:
      ARGUS_DATABASE_URL: postgresql+psycopg://argus:${ARGUS_POSTGRES_PASSWORD:-argus}@postgres:5432/argus
    env_file:
      - path: .env
        required: false
    volumes: ["rawstore:/app/data", "hf_cache:/home/app/.cache"]
    depends_on:
      postgres:
        condition: service_healthy
    # ponytail: no port to probe; worker liveness is observed via the job lease
    # reaper (stuck jobs get reclaimed) and pipeline dashboard, not a container healthcheck

volumes:
  pgdata:
  hf_cache:
  rawstore:
