services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    profiles: ["app"]
    ports: ["8000:8000"]
    environment:
      ARGUS_DATABASE_URL: postgresql+psycopg://argus:argus@postgres:5432/argus
    env_file:
      - path: .env
        required: false
    volumes: ["./data:/app/data"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    profiles: ["app"]
    command: ["argus", "worker"]
    environment:
      ARGUS_DATABASE_URL: postgresql+psycopg://argus:argus@postgres:5432/argus
    env_file:
      - path: .env
        required: false
    volumes: ["./data:/app/data", "hf_cache:/home/app/.cache"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache:
