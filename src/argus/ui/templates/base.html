<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Argus{% endblock %} · Argus</title>
  <!-- ponytail: htmx from CDN, hx-boost only; vendor the file when offline dev matters -->
  <script src="https://unpkg.com/htmx.org@2.0.4"
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
          crossorigin="anonymous"></script>
  <style>
    :root { --bg:#0f1419; --panel:#171d24; --border:#2a3441; --text:#d6dde6;
            --muted:#8b98a5; --accent:#4a9eff; --green:#3fb950; --red:#f85149;
            --amber:#d29922; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font:15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
    nav { display:flex; gap:1.5rem; align-items:baseline; padding:.8rem 2rem;
          background:var(--panel); border-bottom:1px solid var(--border); }
    nav .brand { font-weight:700; letter-spacing:.12em; color:var(--accent);
                 text-transform:uppercase; }
    nav a { color:var(--muted); text-decoration:none; }
    nav a:hover { color:var(--text); }
    main { max-width:60rem; margin:0 auto; padding:2rem; }
    h1 { font-size:1.4rem; } h2 { font-size:1.1rem; margin-top:2rem; }
    .panel { background:var(--panel); border:1px solid var(--border);
             border-radius:8px; padding:1.2rem 1.5rem; margin:1rem 0; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { text-align:left; padding:.45rem .6rem; border-bottom:1px solid var(--border); }
    th { color:var(--muted); font-weight:600; }
    a { color:var(--accent); }
    .badge { font-size:.75rem; padding:.15rem .5rem; border-radius:99px;
             border:1px solid var(--border); color:var(--muted); }
    .badge.complete { color:var(--green); border-color:var(--green); }
    .badge.failed { color:var(--red); border-color:var(--red); }
    .badge.stale { color:var(--amber); border-color:var(--amber); }
    .stance-supporting { border-left:3px solid var(--green); }
    .stance-contradicting { border-left:3px solid var(--red); }
    .stance-unknown { border-left:3px solid var(--border); }
    .evidence { padding:.7rem 1rem; margin:.5rem 0; background:var(--panel);
                border-radius:0 6px 6px 0; font-size:.9rem; }
    .evidence .meta { color:var(--muted); font-size:.8rem; margin-top:.3rem; }
    input[type=text], textarea { width:100%; padding:.55rem .7rem; background:var(--bg);
      border:1px solid var(--border); border-radius:6px; color:var(--text); font:inherit; }
    button { padding:.5rem 1.1rem; background:var(--accent); color:#04121f; border:0;
             border-radius:6px; font:inherit; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.1); }
    .muted { color:var(--muted); } .small { font-size:.85rem; }
    .bar { height:8px; border-radius:4px; background:var(--border); overflow:hidden; }
    .bar > div { height:100%; background:var(--accent); }
    .htmx-request .spinner { display:inline; } .spinner { display:none; }
  </style>
</head>
<body hx-boost="true">
  <nav>
    <span class="brand">Argus</span>
    <a href="/">Investigations</a>
    <a href="/search">Search</a>
    <a href="/pipeline">Pipeline</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
